# Deterministic stand-ins for external providers. BENCH_IMAGE is the Bifrost
# image under test (its Python runs the scripts); bench-scripts is created by
# the harness from scripts/bench/incluster/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-fake-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bench-fake-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bench-fake-llm
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fake-llm
          image: BENCH_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["python", "/bench/fake_llm.py"]
          env:
            - name: FAKE_LLM_LATENCY_MS
              value: "0"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: scripts
              mountPath: /bench
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: scripts
          configMap:
            name: bench-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: bench-fake-llm
spec:
  selector:
    app.kubernetes.io/name: bench-fake-llm
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-fake-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bench-fake-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bench-fake-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fake-api
          image: BENCH_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["python", "/bench/fake_api.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: scripts
              mountPath: /bench
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: scripts
          configMap:
            name: bench-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: bench-fake-api
spec:
  selector:
    app.kubernetes.io/name: bench-fake-api
  ports:
    - name: http
      port: 8080
      targetPort: http
