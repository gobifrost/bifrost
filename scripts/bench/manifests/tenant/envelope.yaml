# The tenant envelope. Values are replaced per profile by the harness, which
# also proves every admitted pod fits (scripts/bench/envelope.py).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-envelope
spec:
  hard:
    requests.cpu: "4"
    limits.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 8Gi
    requests.storage: 50Gi
    persistentvolumeclaims: "4"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-envelope
spec:
  limits:
    - type: Container
      default: {cpu: 100m, memory: 128Mi}
      defaultRequest: {cpu: 100m, memory: 128Mi}
