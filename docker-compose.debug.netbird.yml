# Netbird-mode overlay.
#
# The Netbird sidecar already shares the client's network namespace, exposing
# the control plane on port 80. Put app-host in that same namespace so the same
# peer hostname also exposes the generated-app origin on port 8100. A distinct
# port is a distinct browser origin, so local mesh development needs no second
# DNS record.
services:
  app-host:
    network_mode: "service:client"
    depends_on:
      client:
        condition: service_started
