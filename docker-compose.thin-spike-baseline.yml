# Matched one-executor control for docker-compose.thin-spike.yml.
services:
  api:
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 2g
    memswap_limit: 2g
  worker:
    command: ["python", "-m", "src.worker.main"]
    mem_limit: 2g
    memswap_limit: 2g
  scheduler:
    command: ["sleep", "infinity"]
    healthcheck:
      disable: true
