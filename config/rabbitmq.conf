# RabbitMQ Configuration
# See: https://www.rabbitmq.com/docs/configure

# Disable deprecated management metrics collection
# The management UI still works for queue/exchange management
# We don't need metrics - just basic queue/exchange debugging
deprecated_features.permit.management_metrics_collection = false
management_agent.disable_metrics_collector = true

# Builder turns can legitimately wait on a model for up to two hours. RabbitMQ's
# 30-minute default closes the consumer channel and requeues an otherwise healthy
# turn, which can start a duplicate mutating agent loop. Keep the broker guard
# above the PlatformJob's two-hour hard timeout instead of disabling it.
consumer_timeout = 10800000
