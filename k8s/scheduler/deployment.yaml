apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-scheduler
  namespace: bifrost
  labels:
    app.kubernetes.io/name: bifrost-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: bifrost
spec:
  # Retired: an executor, the same as bifrost-worker. The API now starts
  # worker Jobs on demand (1 warm, up to 6, 2Gi each by default; Settings ->
  # Kubernetes), so this stays at zero for one release, letting
  # `kubectl apply -k` stop pods an earlier release left running. Delete the
  # Deployment after upgrading; a later release removes this file.
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost-scheduler
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/part-of: bifrost
    spec:
      automountServiceAccountToken: false
      containers:
        - name: scheduler
          image: ghcr.io/gobifrost/bifrost-api:latest
          command: ["python", "-m", "src.scheduler.main"]
          envFrom:
            - configMapRef:
                name: bifrost-config
            - secretRef:
                name: bifrost-secrets
          env:
            - name: PIP_NO_CACHE_DIR
              value: "1"
            - name: HOME
              value: /home/bifrost
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # The worker's hardening: this container runs user workflow code too.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          # The event loop is still advancing (the entry point's heartbeat).
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - src.scheduler.health
                - --max-age
                - "60"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Ready once the schema gate passed and the executor can claim
          # work, so a rollout pauses while new pods wait for migrations.
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - src.scheduler.health
                - --ready
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: home
              mountPath: /home/bifrost
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      # Drain budget: drain deadline (300s) + cleanup margin (60s)
      terminationGracePeriodSeconds: 360
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
