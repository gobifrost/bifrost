apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-scheduler
  namespace: bifrost
  labels:
    app.kubernetes.io/name: bifrost-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: bifrost
spec:
  # Safe to scale: every replica executes platform jobs while PostgreSQL
  # elects one APScheduler/pub-sub trigger leader.
  replicas: 1
  strategy:
    # Keep Recreate so the first upgrade cannot overlap a pre-election
    # scheduler pod with a new lease-aware pod. This does not prevent scaling.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost-scheduler
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/part-of: bifrost
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/gobifrost/bifrost-api:latest
          command: ["python", "-m", "src.scheduler.main"]
          envFrom:
            - configMapRef:
                name: bifrost-config
            - secretRef:
                name: bifrost-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # Verify the asyncio event loop is still advancing. Platform-job
          # subprocesses share this cgroup and are stopped before hard pressure.
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - src.scheduler.health
                - --max-age
                - "60"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      # Run as non-root user (matches Dockerfile)
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
