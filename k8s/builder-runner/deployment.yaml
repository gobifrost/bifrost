apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-builder-runner
  namespace: bifrost
  labels:
    app.kubernetes.io/name: bifrost-builder-runner
    app.kubernetes.io/component: builder-runner
    app.kubernetes.io/part-of: bifrost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost-builder-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost-builder-runner
        app.kubernetes.io/component: builder-runner
        app.kubernetes.io/part-of: bifrost
    spec:
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: ghcr.io/gobifrost/bifrost-builder-runner:latest
          ports:
            - name: http
              containerPort: 8300
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8300
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8300
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
