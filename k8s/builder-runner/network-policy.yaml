apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bifrost-builder-runner-isolation
  namespace: bifrost
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bifrost-builder-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost-builder
      ports:
        - protocol: TCP
          port: 8300
  egress: []
