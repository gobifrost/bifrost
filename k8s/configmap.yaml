apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-config
  namespace: bifrost
  labels:
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/part-of: bifrost
data:
  # Environment
  BIFROST_ENVIRONMENT: "production"
  BIFROST_DEBUG: "false"

  # S3 Configuration (non-sensitive)
  BIFROST_S3_BUCKET: "my-bifrost-bucket"
  BIFROST_S3_REGION: "us-east-1"

  # JWT Settings
  BIFROST_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  BIFROST_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # MFA Settings
  BIFROST_MFA_ENABLED: "true"
  BIFROST_MFA_TOTP_ISSUER: "Bifrost"

  # Worker Concurrency
  BIFROST_MAX_CONCURRENCY: "10"

  # WebAuthn/Passkeys Configuration
  BIFROST_WEBAUTHN_RP_ID: "bifrost.example.com"
  BIFROST_WEBAUTHN_RP_NAME: "Bifrost"
  BIFROST_WEBAUTHN_ORIGIN: "https://bifrost.example.com"

  # Public URL
  BIFROST_PUBLIC_URL: "https://bifrost.example.com"
  # Generated apps use the same hostname on a second externally routed port by
  # default, avoiding another DNS record. Route external :8443 to app-host:8100.
  # A sibling hostname remains an optional override for proxies that cannot
  # expose the second port.
  BIFROST_APP_ORIGIN: "https://bifrost.example.com:8443"

  # Dedicated build plane.
  BIFROST_INTERNAL_API_URL: "http://api:8000"
  BIFROST_BUILDER_RUNNER_URL: "http://builder-runner:8300"
  BIFROST_BUILDER_MAX_CONCURRENT_BUILDS: "1"
  BIFROST_BUILDER_BUILD_TIMEOUT_S: "600"
  BIFROST_BUILDER_OUTPUT_LIMIT_BYTES: "104857600"

  # glibc arena cap. Default is 8*nproc arenas, each caching up to ~64MB of
  # freed memory. On a 2-CPU pod with a 1GiB limit, the default can retain
  # ~1GiB of cached-free memory (inactive_anon), leaving no headroom for
  # allocation bursts (e.g. app bundler runs). Cap at 2 for Python workloads.
  MALLOC_ARENA_MAX: "2"
