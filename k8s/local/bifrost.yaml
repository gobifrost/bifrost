apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bifrost-local
spec:
  selector:
    app.kubernetes.io/name: bifrost-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-api
  namespace: bifrost-local
spec:
  # Two control replicas: trigger leadership hands over between them.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost-api
    spec:
      # Runs the worker controller: may manage worker Jobs (api-rbac.yaml).
      serviceAccountName: bifrost-api
      automountServiceAccountToken: true
      containers:
        - name: api
          image: bifrost-api:kind-local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "300"]
          envFrom:
            - configMapRef:
                name: bifrost-local-config
            - secretRef:
                name: bifrost-local-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      # API remote-control and agent consumers may drain for 300 seconds.
      terminationGracePeriodSeconds: 310
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-scheduler
  namespace: bifrost-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost-scheduler
    spec:
      automountServiceAccountToken: false
      containers:
        - name: scheduler
          image: bifrost-api:kind-local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.scheduler.main"]
          envFrom:
            - configMapRef:
                name: bifrost-local-config
            - secretRef:
                name: bifrost-local-secrets
          readinessProbe:
            exec:
              command: ["python", "-m", "src.scheduler.health", "--ready"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-worker
  namespace: bifrost-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 360
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: bifrost-api:kind-local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.worker.main"]
          readinessProbe:
            exec:
              command: ["python", "-m", "src.worker.health", "--ready"]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: BIFROST_DATABASE_POOL_SIZE
              value: "1"
            - name: BIFROST_DATABASE_MAX_OVERFLOW
              value: "2"
            - name: PIP_NO_CACHE_DIR
              value: "1"
            - name: HOME
              value: /home/bifrost
          envFrom:
            - configMapRef:
                name: bifrost-local-config
            - secretRef:
                name: bifrost-local-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/bifrost
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: workspace
          emptyDir: {}
