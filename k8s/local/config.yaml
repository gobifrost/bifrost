apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-local-config
  namespace: bifrost-local
data:
  BIFROST_ENVIRONMENT: testing
  BIFROST_DEBUG: "false"
  BIFROST_KUBERNETES_SPIKE: "1"
  BIFROST_PUBLIC_URL: http://localhost:8000
  BIFROST_API_URL: http://api:8000
  BIFROST_CORS_ORIGINS: http://localhost:3000,http://localhost:8000
  BIFROST_REDIS_URL: redis://redis:6379/0
  BIFROST_S3_BUCKET: bifrost-local
  BIFROST_S3_ENDPOINT_URL: http://seaweedfs:8333
  BIFROST_S3_ACCESS_KEY: bifrost
  BIFROST_S3_REGION: us-east-1
  BIFROST_S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
  BIFROST_MFA_ENABLED: "false"
  BIFROST_WEBAUTHN_RP_ID: localhost
  BIFROST_WEBAUTHN_RP_NAME: Bifrost Local Kind
  BIFROST_WEBAUTHN_ORIGIN: http://localhost:8000
  BIFROST_MAX_CONCURRENCY: "10"
  BIFROST_DRAIN_DEADLINE_SECONDS: "300"
  BIFROST_DATABASE_POOL_SIZE: "5"
  BIFROST_DATABASE_MAX_OVERFLOW: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: bifrost-local-secrets
  namespace: bifrost-local
type: Opaque
stringData:
  POSTGRES_PASSWORD: bifrost_dev
  RABBITMQ_PASSWORD: bifrost_dev
  SEAWEEDFS_SECRET_KEY: bifrost_dev
  BIFROST_SECRET_KEY: dev-secret-key-change-in-production-must-be-32-chars
  BIFROST_DEFAULT_USER_EMAIL: dev@gobifrost.com
  BIFROST_DEFAULT_USER_PASSWORD: password
  BIFROST_DATABASE_URL: postgresql+asyncpg://bifrost:bifrost_dev@pgbouncer:5432/bifrost
  BIFROST_DATABASE_URL_SYNC: postgresql://bifrost:bifrost_dev@pgbouncer:5432/bifrost
  BIFROST_RABBITMQ_URL: amqp://bifrost:bifrost_dev@rabbitmq.bifrost-local.svc.cluster.local:5672/
  BIFROST_S3_SECRET_KEY: bifrost_dev
