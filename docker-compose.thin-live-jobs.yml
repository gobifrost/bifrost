# Additional fixtures for the opt-in exhaustive job-type live pass.
# Apply after docker-compose.thin-spike.yml (or its baseline overlay).
services:
  thin-providers:
    image: bifrost-test-api-dev:${BIFROST_TEST_IMAGE_TAG:-latest}
    command: ["python", "-m", "scripts.thin_provider_fixture"]
    volumes:
      - ./api/scripts:/app/scripts:ro
      - thin-provider-tls:/fixture-tls
    networks:
      default:
        aliases: [fixture.openrouter.ai]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://fixture.openrouter.ai:8443/health',context=ssl.create_default_context(cafile='/fixture-tls/trust.pem'))"]
      interval: 1s
      timeout: 3s
      retries: 30
  api:
    environment:
      SSL_CERT_FILE: /fixture-tls/trust.pem
      EMBEDDING_ALLOWED_HOSTS: scheduler-fixtures
      GIT_CONFIG_GLOBAL: /fixture-gitconfig
    volumes:
      - thin-provider-tls:/fixture-tls:ro
      - ./api/scripts/thin_fixture.gitconfig:/fixture-gitconfig:ro
    depends_on:
      thin-providers:
        condition: service_healthy
  worker:
    environment:
      SSL_CERT_FILE: /fixture-tls/trust.pem
      EMBEDDING_ALLOWED_HOSTS: scheduler-fixtures
      GIT_CONFIG_GLOBAL: /fixture-gitconfig
    volumes:
      - thin-provider-tls:/fixture-tls:ro
      - ./api/scripts/thin_fixture.gitconfig:/fixture-gitconfig:ro
    depends_on:
      thin-providers:
        condition: service_healthy
volumes:
  thin-provider-tls:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0755
