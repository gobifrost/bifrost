# Explicit, local-only overlay for the footprint experiment. Start the normal
# ./test.sh stack first, then recreate these three services with this overlay.
# test.sh resets stop/start the same containers, retaining these commands.
services:
  api:
    command: ["uvicorn", "src.dev.thin_host:create_host", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BIFROST_THIN_TOKEN_FILE: /thin-control/bootstrap
      BIFROST_SERVICE_CLAIM_INTERVAL_SECONDS: "1"
      BIFROST_SERVICE_HEARTBEAT_INTERVAL_SECONDS: "2"
    volumes:
      - thin-control:/thin-control
    mem_limit: 2g
    memswap_limit: 2g
  worker:
    command: ["python", "-m", "src.dev.thin_launcher"]
    environment:
      BIFROST_THIN_TOKEN_FILE: /thin-control/bootstrap
      BIFROST_THIN_CONTROL_URL: ws://api:8000/_dev/thin-control
      BIFROST_API_URL: http://api:8000
    volumes:
      - thin-control:/thin-control
    mem_limit: 2g
    memswap_limit: 2g
  scheduler:
    # One executor per comparison. The ordinary API already hosts triggers.
    command: ["sleep", "infinity"]
    healthcheck:
      disable: true
volumes:
  thin-control:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0700
