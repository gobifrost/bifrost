# Bifrost execution-capacity provider on Cloudflare Containers.
#
# Fill in name, scope, worker image digest, and API origin, then:
#   node --test capacity.test.mjs
#   npx wrangler deploy
#
# The API remains the canonical owner of demand, admission, claims, progress,
# cancellation, and recovery (PostgreSQL). This Worker only prepares, starts,
# and deletes container incarnations by exact resource UID. It never receives
# job payloads and never chooses which jobs execute.
#
# NOTE: Cloudflare's container-enabled Durable Object configuration is still
# moving. Validate this file against the pinned Wrangler version before
# deploying; the class names and bindings below are the contract this code
# depends on.
name = "bifrost-worker-capacity"
main = "./capacity.mjs"
compatibility_date = "2026-11-10"

[[durable_objects.bindings]]
name = "WORKER_LEDGER"
class_name = "WorkerLedger"

[[durable_objects.bindings]]
name = "SCOPE_REGISTRY"
class_name = "ScopeRegistry"

[[durable_objects.bindings]]
name = "WORKER_CONTAINER"
class_name = "WorkerContainer"

# One container class backs every incarnation; each worker is addressed by its
# own Durable Object id, so one binding serves N workers.
[[containers]]
class_name = "WorkerContainer"
scheduling_policy = "durable_object"
# Wrangler prepares this managed-registry image before publishing the Worker.
# WorkerContainer selects standard-1 (4 GiB) explicitly at start. ScopeRegistry
# owns admission and retains uncertain launches against MAX_WORKERS.
[containers.images.worker]
image = "registry.cloudflare.com/CHANGEME/bifrost-worker@sha256:CHANGEME"

[[migrations]]
tag = "v1"
# Every Durable Object class must be SQLite-backed: Cloudflare no longer creates
# key-value backed namespaces for new classes (API error 10099).
new_sqlite_classes = ["WorkerLedger", "ScopeRegistry", "WorkerContainer"]

[vars]
# Opaque provider scope. Must equal the scope configured on the API side.
SCOPE = "CHANGEME"
# Must equal the embedded version of the pinned worker image.
WORKER_VERSION = "CHANGEME"
MEMORY_LIMIT_BYTES = "4294967296"
MAX_WORKERS = "4"
# Cloudflare caps a container's inactivity timeout at six hours.
MAX_LIFETIME_SECONDS = "21600"
STARTING_GRACE_MS = "30000"
# API-only container inputs, such as BIFROST_API_URL and runtime home paths.
# Database, Redis, storage and installation signing credentials are forbidden.
# The provider derives a per-resource control key from CAPACITY_TOKEN; that key
# cannot authenticate another incarnation or the static-worker form.
WORKER_CONTAINER_ENV = '{}'

# CAPACITY_TOKEN is a Worker secret, not a var: `npx wrangler secret put CAPACITY_TOKEN`.
# The provider refuses to serve when it is missing.

[observability]
enabled = true
