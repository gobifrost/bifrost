apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-scheduler
  namespace: bifrost
spec:
  template:
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      containers:
        - name: scheduler
          envFrom:
            - configMapRef:
                name: bifrost-config
            - secretRef:
                name: bifrost-secrets
            - configMapRef:
                name: bifrost-build-jobs-config
            - configMapRef:
                name: bifrost-control-config
