apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-api
  namespace: bifrost
spec:
  template:
    spec:
      serviceAccountName: bifrost-build-controller
      automountServiceAccountToken: true
      containers:
        - name: api
          envFrom:
            - configMapRef:
                name: bifrost-config
            - secretRef:
                name: bifrost-secrets
            - configMapRef:
                name: bifrost-build-jobs-config
            - configMapRef:
                name: bifrost-control-config
