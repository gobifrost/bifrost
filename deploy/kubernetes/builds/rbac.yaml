apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bifrost-build-controller
  namespace: bifrost
  labels:
    app.kubernetes.io/name: bifrost-build-controller
    app.kubernetes.io/component: build-controller
    app.kubernetes.io/part-of: bifrost
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bifrost-build-controller
  namespace: bifrost
  labels:
    app.kubernetes.io/name: bifrost-build-controller
    app.kubernetes.io/component: build-controller
    app.kubernetes.io/part-of: bifrost
subjects:
  - kind: ServiceAccount
    name: bifrost-build-controller
    namespace: bifrost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bifrost-build-controller

