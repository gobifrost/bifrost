name: Prepare Product Updates
description: Bundle approved running-build history and local screenshots before image builds.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
    - shell: bash
      run: |
        python -m pip install --require-hashes -r requirements-product-updates.lock
        python -m scripts.prepare_product_updates_image --target "$GITHUB_SHA"
