name: Chore
description: Maintenance, tooling, deps, CI, or refactor without user-visible change
title: "[chore]: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Read our [Contribution Scope](https://github.com/gobifrost/bifrost/blob/main/CONTRIBUTING.md#contribution-scope) before filing. Describe actual use, a maintainer request, or a verified security-hardening basis. Use [private reporting](https://github.com/gobifrost/bifrost/security/advisories/new) for suspected vulnerabilities; keep interest checks in Discussions or Discord.
  - type: textarea
    id: what
    attributes:
      label: What
      description: What change is being made
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why now — what does this unblock, fix, or prevent?
    validations:
      required: true
