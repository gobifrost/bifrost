# OpenSSF Scorecard
# Reference: https://github.com/ossf/scorecard-action
#
# Publishes results to:
#   - GitHub Security tab → Code scanning (under "scorecard")
#   - https://api.securityscorecards.dev/projects/github.com/gobifrost/bifrost
#
# The README badge auto-updates from the public API.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 10 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required to upload SARIF to code-scanning
      id-token: write # required for Sigstore OIDC publish_results
      contents: read
      actions: read # required by scorecard-action to read workflow metadata
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
