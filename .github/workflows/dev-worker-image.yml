name: Development Worker Image

on:
  push:
    branches: ["dev/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dev-worker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Development Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute immutable development identity
        id: identity
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY_OWNER,,}/bifrost-worker-dev"
          # Fork release tags need not be ancestors of upstream-based branches.
          # Keep canonical upstream tags separate from the fork's own tags.
          git fetch --no-tags https://github.com/gobifrost/bifrost.git \
            'refs/tags/v*:refs/tags/bifrost-upstream/v*'
          release="$(git describe --tags --abbrev=0 --match 'bifrost-upstream/v[0-9]*')"
          if ! [[ "$release" =~ ^bifrost-upstream/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "No canonical semantic release tag found for this development source" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-dev.$(git show -s --format=%ct HEAD)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare approved in-app updates
        uses: ./.github/actions/prepare-product-updates

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to this repository's package registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact development worker
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
          build-args: BIFROST_VERSION=${{ steps.identity.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            com.bifrost.development=true
          cache-from: type=gha,scope=dev-worker-image
          cache-to: type=gha,scope=dev-worker-image,mode=max

      - name: Exercise the published development artifact
        env:
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm -e EXPECTED_VERSION --entrypoint python "$IMAGE" \
            -c "import os; from shared.version import get_version; from src.main import app; from src.worker.remote.launcher import Launcher; assert app is not None; assert Launcher is not None; assert get_version() == os.environ['EXPECTED_VERSION']"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign development digest
        env:
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest development provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Record development artifact
        env:
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          {
            echo "Development worker: $IMAGE"
            echo "Source: $GITHUB_SHA"
            echo "Version: $VERSION"
            echo "Development publication only. No deployment or production tag promotion."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export the published image for authenticated development transfer
        env:
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dev-image
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > dev-image/worker-image.tar.gz
          local_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          archive="$(sha256sum dev-image/worker-image.tar.gz | cut -d' ' -f1)"
          jq -n --arg source "$GITHUB_SHA" --arg image "$IMAGE" \
            --arg version "$VERSION" --arg local_id "$local_id" --arg archive "$archive" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{source:$source,image:$image,version:$version,local_image_id:$local_id,archive_sha256:$archive,run_id:$run,run_attempt:$attempt}' \
            > dev-image/identity.json

      - name: Retain exact development image and identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-worker-image-${{ github.sha }}
          path: dev-image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
