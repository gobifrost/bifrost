name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # Skip CI for documentation/plugin/config-only changes. The companion workflow
    # ci-noop.yml fires on these same paths and reports the same status-check
    # names (Lint & Type Check, Unit Tests, E2E Tests) so branch protection
    # still sees the required checks reported as green.
    #
    # IMPORTANT: do NOT add .github/workflows/** to this list — workflow
    # changes must always run CI so we catch CI-breaking edits before merge.
    # Also do NOT add **/*.yml, **/*.yaml, **/*.json, or **/*.toml — these
    # cover real config (docker-compose, package-lock, tsconfig, pyproject)
    # that does affect runtime/tests and must run CI.
    #
    # The companion ci-noop.yml `paths:` list MUST stay byte-identical to
    # this `paths-ignore:` list — branch protection relies on the inverse
    # mapping to always report the required check names.
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "**/*.webp"
      - "**/*.ico"
      - ".agents/**"
      - ".claude/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - ".codex-plugin/**"
      - "plugins/bifrost/**"
      - "docs/**"
      - "LICENSE"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".prettierrc*"
      - ".prettierignore"
      - ".vscode/**"
      - ".idea/**"
  # GitHub merge queue runs CI on a synthetic ref containing
  # main + queued PRs stacked in queue order. Required status
  # checks must fire on this event or the queue blocks forever
  # waiting on absent statuses.
  merge_group:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: gobifrost/bifrost-api
  CLIENT_IMAGE: gobifrost/bifrost-client
  # Legacy image names under jackmusick — kept for dual-publish during namespace
  # migration window. Remove after 2 stable releases or 60 days post-transfer.
  LEGACY_API_IMAGE: jackmusick/bifrost-api
  LEGACY_CLIENT_IMAGE: jackmusick/bifrost-client

permissions:
  contents: read

jobs:
  # =============================================================================
  # Lint & Type Check - Fast, gates all builds alongside unit tests
  # =============================================================================
  lint:
    # Skip on push: main — the merge_group run already covered this
    # commit. Still runs on PRs, queue, tag pushes, and workflow_dispatch.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Lint & Type Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check GitHub Action pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 api/scripts/check_github_action_pins.py --verify-versions

      # Codex skill mirrors (plugins/bifrost/skills/, .codex/skills/) are
      # generated from the canonical .claude/skills/ source. Regenerate and fail
      # if the committed mirrors drift. NOTE: ci.yml paths-ignore skips CI for
      # plugin/skill-only/.md-only PRs (they route to ci-noop.yml), so this gate fires
      # when non-ignored source changes — which is when a mirror regen is most
      # likely needed anyway.
      - name: Codex skill mirrors in sync
        run: |
          chmod +x scripts/sync-codex-skills.sh
          ./scripts/sync-codex-skills.sh
          git diff --exit-code -- plugins/bifrost/skills .codex/skills \
            || { echo "::error::Codex skill mirrors are stale — run scripts/sync-codex-skills.sh and commit."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Create .venv at the repo root so pyrightconfig.json's
      # `venvPath: ..` + `venv: .venv` resolves the same way locally and in CI.
      # Install runtime deps from the hash-pinned lock file (Scorecard
      # Pinned-Dependencies); pyright is installed from its own hash-pinned
      # lock because --require-hashes forbids unpinned packages and pyright
      # targets a different Python minor (3.12 here vs 3.14 in production)
      # so it can't share requirements.lock.
      #
      # We deliberately do NOT `pip install --upgrade pip` — actions/setup-python
      # already ships a current pip into the venv and any explicit upgrade
      # would be flagged by Scorecard as an unpinned install.
      - name: Install Python deps into .venv
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --require-hashes -r requirements.lock
          ./.venv/bin/pip install --require-hashes -r requirements-pyright.lock

      - name: Ruff
        working-directory: api
        run: ../.venv/bin/ruff check .

      - name: Pyright
        working-directory: api
        run: ../.venv/bin/pyright

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: TypeScript
        working-directory: client
        run: npm run tsc

      - name: ESLint
        working-directory: client
        run: npm run lint

  # =============================================================================
  # Client Unit Tests (Vitest) - Fast, runs on host Node — no Docker needed.
  # Parallel to Unit Tests; does NOT become the critical path.
  # =============================================================================
  test-client-unit:
    # Skip on push: main — covered by the merge_group run.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Client Unit Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Vitest
        working-directory: client
        run: npm test

  # =============================================================================
  # Dev Artifact Candidate - build once for the exact merge candidate.
  #
  # The SHA-addressed candidate tags are internal staging references, not the
  # shared :dev channel. This job runs in parallel with the complete suite and
  # is folded into the required aggregate below. Only after the identical SHA
  # reaches main may build-dev promote these exact digests to :dev.
  # =============================================================================
  build-dev-candidate:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    name: Build Dev Candidate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute candidate version
        id: version
        run: echo "version=$(./scripts/compute-dev-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push SHA-addressed API candidate
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.API_IMAGE }}:candidate-${{ github.sha }}
          build-args: BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=dev-candidate-api
          cache-to: type=gha,scope=dev-candidate-api,mode=max

      - name: Exercise the exact API candidate artifact
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm \
            -e EXPECTED_VERSION \
            --entrypoint python \
            "ghcr.io/${{ env.API_IMAGE }}@${{ steps.api.outputs.digest }}" \
            -c "import os; from shared.version import get_version; from src.main import app; assert app is not None; assert get_version() == os.environ['EXPECTED_VERSION']"

      - name: Sign API candidate digest
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes ghcr.io/${{ env.API_IMAGE }}@${{ steps.api.outputs.digest }}

      - name: Attest API candidate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Build and push SHA-addressed client candidate
        id: client
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.CLIENT_IMAGE }}:candidate-${{ github.sha }}
          build-args: VITE_BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=dev-candidate-client
          cache-to: type=gha,scope=dev-candidate-client,mode=max

      - name: Sign client candidate digest
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes ghcr.io/${{ env.CLIENT_IMAGE }}@${{ steps.client.outputs.digest }}

      - name: Attest client candidate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.CLIENT_IMAGE }}
          subject-digest: ${{ steps.client.outputs.digest }}
          push-to-registry: true

  # =============================================================================
  # Critical Browser Smoke - exact candidates only, zero retries.
  # This is deliberately not the full Playwright product suite; nightly owns
  # that breadth. These paths prove the live browser/API/worker boundaries that
  # backend E2E cannot observe.
  # =============================================================================
  test-client-smoke:
    if: >-
      always() && (
        github.event_name == 'merge_group' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    needs: [build-dev-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Critical Browser Smoke
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build API dev image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile.dev
          load: true
          tags: bifrost-test-api-dev:latest
          cache-from: type=gha,scope=test-api-dev
          cache-to: type=gha,scope=test-api-dev,mode=max

      - name: Build production client under test (cached)
        if: github.event_name != 'merge_group'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile
          target: production
          load: true
          tags: bifrost-test-client-e2e:latest
          build-args: VITE_BIFROST_VERSION=test-${{ github.sha }}
          cache-from: type=gha,scope=test-client-e2e
          cache-to: type=gha,scope=test-client-e2e,mode=max

      - name: Use the exact merge candidate client image
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/${{ env.CLIENT_IMAGE }}:candidate-${GITHUB_SHA}
          docker tag \
            ghcr.io/${{ env.CLIENT_IMAGE }}:candidate-${GITHUB_SHA} \
            bifrost-test-client-e2e:latest

      - name: Build Playwright runner (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile.playwright
          load: true
          tags: bifrost-test-playwright:latest
          cache-from: type=gha,scope=test-playwright
          cache-to: type=gha,scope=test-playwright,mode=max

      - name: Run critical browser smoke
        env:
          BIFROST_SKIP_BUILD: "1"
          BIFROST_TEST_USE_CLEAN_BOOT: "1"
        run: |
          chmod +x test.sh
          ./test.sh stack up
          ./test.sh client smoke

      - name: Export stack logs and tear down
        if: always()
        run: ./test.sh stack down

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-browser-smoke-${{ github.run_attempt }}
          path: |
            client/playwright-results
            /tmp/bifrost-*/
          if-no-files-found: error
          retention-days: 14

  # =============================================================================
  # Unit Tests - Fast, gates all builds
  # =============================================================================
  test-unit:
    # Skip on push: main — covered by the merge_group run.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Pre-build the API dev image via build-push-action for GHA layer caching.
      # docker-compose.test.yml pins all api-stack services to bifrost-test-api-dev:latest
      # Browser jobs separately build the production client under test. When
      # BIFROST_SKIP_BUILD=1, test.sh passes --no-build to compose so it reuses
      # the local API image instead of rebuilding (which would skip the GHA cache).
      # Cache scope is shared with test-e2e so whichever job runs second gets warm hits.
      - name: Build API dev image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile.dev
          load: true
          tags: bifrost-test-api-dev:latest
          cache-from: type=gha,scope=test-api-dev
          cache-to: type=gha,scope=test-api-dev,mode=max

      - name: Run unit tests
        env:
          BIFROST_SKIP_BUILD: "1"
          BIFROST_TEST_USE_CLEAN_BOOT: "1"
        run: |
          chmod +x test.sh
          ./test.sh stack up
          ./test.sh unit

  # =============================================================================
  # E2E Tests - Sharded across 2 parallel runners. Each shard boots its own
  # isolated test stack (no xdist, no shared services between shards).
  # scripts/e2e_shard.py deterministically allocates test files: heavies
  # bin-packed first, then round-robin in sorted order — adding a file only
  # moves files in shards downstream of the insertion point.
  #
  # The complete suite intentionally runs on merge_group rather than ordinary
  # pull_request events. The merge queue's synthetic ref is the exact candidate
  # that can reach main and trigger shared :dev image publication. Tag and
  # workflow_dispatch runs remain complete as well.
  #
  # The internal matrix job (test-e2e) uses shard names like
  # "E2E Tests (shard 1/2)". The aggregate gate job below (test-e2e-gate)
  # is named EXACTLY "E2E Tests" to match the required status check name —
  # no ruleset edits needed.
  # =============================================================================
  test-e2e:
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: E2E Tests (shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # See test-unit for caching strategy notes.
      - name: Build API dev image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile.dev
          load: true
          tags: bifrost-test-api-dev:latest
          cache-from: type=gha,scope=test-api-dev
          cache-to: type=gha,scope=test-api-dev,mode=max

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        env:
          BIFROST_SKIP_BUILD: "1"
          BIFROST_TEST_USE_CLEAN_BOOT: "1"
        run: |
          chmod +x test.sh
          ./test.sh stack up
          mapfile -t shard_files < <(python3 scripts/e2e_shard.py --shard-id ${{ matrix.shard }} --total 2)
          if [ ${#shard_files[@]} -eq 0 ]; then
            echo "ERROR: shard ${{ matrix.shard }} resolved to zero files" >&2
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/2: ${#shard_files[@]} files"
          ./test.sh "${shard_files[@]}" -v --durations=50

  # Aggregate gate — required check named "E2E Tests" (matches ruleset 15329014).
  # Fails if either backend E2E shard, the client unit suite, or the critical
  # browser smoke failed/cancelled. The component/browser jobs have their own
  # visible names but are folded into this required context so the repository
  # settings do not need to change.
  # Runs even when dependencies fail (if: always()) so branch protection always
  # sees a conclusive result.
  test-e2e-gate:
    if: >-
      always() && (
        github.event_name == 'pull_request' ||
        github.event_name == 'merge_group' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    needs: [test-e2e, test-client-unit, test-client-smoke, build-dev-candidate]
    runs-on: ubuntu-latest
    name: E2E Tests
    steps:
      - name: Check shard results
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.test-client-unit.result }}" != "success" ]; then
              echo "Client unit tests failed or were cancelled (result: ${{ needs.test-client-unit.result }})"
              exit 1
            fi
            echo "Full E2E is deferred to the merge queue's exact merge candidate."
            echo "A successful merge_group E2E Tests check is required before main and :dev images."
            exit 0
          fi

          if [ "${{ needs.test-e2e.result }}" != "success" ] || \
             [ "${{ needs.test-client-unit.result }}" != "success" ] || \
             [ "${{ needs.test-client-smoke.result }}" != "success" ] || \
             { [ "${{ github.event_name }}" = "merge_group" ] && \
               [ "${{ needs.build-dev-candidate.result }}" != "success" ]; }; then
            echo "E2E matrix result: ${{ needs.test-e2e.result }}"
            echo "Client unit result: ${{ needs.test-client-unit.result }}"
            echo "Critical browser smoke result: ${{ needs.test-client-smoke.result }}"
            echo "Dev candidate result: ${{ needs.build-dev-candidate.result }}"
            exit 1
          fi
          echo "All exact-candidate suites and required artifact builds passed."

  # =============================================================================
  # Dev Promotion - main may only publish the already-built exact candidate.
  # =============================================================================
  build-dev:
    # Only fires on push: main — branch protection + merge queue
    # already gated this commit, so no needs: here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Promote Dev Images
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify exact merge candidate gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 api/scripts/verify_merge_candidate.py
          --repository "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA"

      - name: Compute version
        id: version
        run: |
          VERSION=$(./scripts/compute-dev-version.sh)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Surface manifest drift to the job summary. Plugin manifests are updated
      # at tag time (see bifrost-release skill) — between tags the `version`
      # field reflects the last released version, not the current dev version.
      # This step is informational only; it does not fail the build and does
      # not commit anything back. See PR #246 for the rationale (branch
      # protection + commit-back loop avoidance).
      - name: Report plugin manifest drift
        run: |
          DEV_VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Plugin manifest versions"
            echo ""
            echo "- Computed dev version: \`${DEV_VERSION}\`"
            for manifest in \
              .claude-plugin/plugin.json \
              .codex-plugin/plugin.json \
              plugins/bifrost/.codex-plugin/plugin.json; do
              manifest_version=$(jq -r '.version' "$manifest")
              echo "- Manifest (${manifest}): \`${manifest_version}\`"
            done
            echo ""
            echo "Manifests reflect the last tagged release; they advance at tag time via the bifrost-release skill."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve exact-candidate digests
        id: candidate
        run: |
          set -euo pipefail
          API_CANDIDATE="ghcr.io/${{ env.API_IMAGE }}:candidate-${GITHUB_SHA}"
          CLIENT_CANDIDATE="ghcr.io/${{ env.CLIENT_IMAGE }}:candidate-${GITHUB_SHA}"
          API_DIGEST=$(docker buildx imagetools inspect "$API_CANDIDATE" --format '{{ .Manifest.Digest }}')
          CLIENT_DIGEST=$(docker buildx imagetools inspect "$CLIENT_CANDIDATE" --format '{{ .Manifest.Digest }}')
          case "$API_DIGEST" in sha256:*) ;; *) echo "Invalid API candidate digest: $API_DIGEST" >&2; exit 1;; esac
          case "$CLIENT_DIGEST" in sha256:*) ;; *) echo "Invalid client candidate digest: $CLIENT_DIGEST" >&2; exit 1;; esac
          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "client_digest=$CLIENT_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Promote the identical signed candidate digests
        run: |
          set -euo pipefail
          API_SOURCE="ghcr.io/${{ env.API_IMAGE }}@${{ steps.candidate.outputs.api_digest }}"
          CLIENT_SOURCE="ghcr.io/${{ env.CLIENT_IMAGE }}@${{ steps.candidate.outputs.client_digest }}"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}" \
            --tag "ghcr.io/${{ env.API_IMAGE }}:dev" \
            --tag "ghcr.io/${{ env.API_IMAGE }}:sha-${{ steps.version.outputs.short_sha }}" \
            "$API_SOURCE"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ env.CLIENT_IMAGE }}:${{ steps.version.outputs.version }}" \
            --tag "ghcr.io/${{ env.CLIENT_IMAGE }}:dev" \
            --tag "ghcr.io/${{ env.CLIENT_IMAGE }}:sha-${{ steps.version.outputs.short_sha }}" \
            "$CLIENT_SOURCE"

      - name: Verify every promoted tag resolves to the candidate digest
        run: |
          set -euo pipefail
          verify_tags() {
            local image="$1" expected="$2"
            shift 2
            for tag in "$@"; do
              actual=$(docker buildx imagetools inspect "ghcr.io/${image}:${tag}" --format '{{ .Manifest.Digest }}')
              if [ "$actual" != "$expected" ]; then
                echo "Digest mismatch for ${image}:${tag}: expected ${expected}, got ${actual}" >&2
                exit 1
              fi
            done
          }
          verify_tags "${{ env.API_IMAGE }}" "${{ steps.candidate.outputs.api_digest }}" \
            "${{ steps.version.outputs.version }}" dev "sha-${{ steps.version.outputs.short_sha }}"
          verify_tags "${{ env.CLIENT_IMAGE }}" "${{ steps.candidate.outputs.client_digest }}" \
            "${{ steps.version.outputs.version }}" dev "sha-${{ steps.version.outputs.short_sha }}"

      # ---------------------------------------------------------------------------
      # Transitional dual-publish to legacy ghcr.io/jackmusick/* namespace.
      # This keeps Keel-polling clusters that pin the old image name converging
      # during the migration window. Sunset: remove after 2 stable releases or
      # 60 days post-transfer to gobifrost, whichever comes first.
      # ---------------------------------------------------------------------------
      - name: Dual-publish dev images to legacy jackmusick namespace
        # Map secret to env var so job-level if-condition can test it
        # (secrets cannot be referenced directly in job if-conditions).
        env:
          GHCR_LEGACY_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
        if: ${{ env.GHCR_LEGACY_TOKEN != '' }}
        run: |
          echo "$GHCR_LEGACY_TOKEN" | docker login ghcr.io -u jackmusick --password-stdin

          docker buildx imagetools create \
            --tag "ghcr.io/${{ env.LEGACY_API_IMAGE }}:${{ steps.version.outputs.version }}" \
            --tag "ghcr.io/${{ env.LEGACY_API_IMAGE }}:dev" \
            --tag "ghcr.io/${{ env.LEGACY_API_IMAGE }}:sha-${{ steps.version.outputs.short_sha }}" \
            "ghcr.io/${{ env.API_IMAGE }}@${{ steps.candidate.outputs.api_digest }}"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ env.LEGACY_CLIENT_IMAGE }}:${{ steps.version.outputs.version }}" \
            --tag "ghcr.io/${{ env.LEGACY_CLIENT_IMAGE }}:dev" \
            --tag "ghcr.io/${{ env.LEGACY_CLIENT_IMAGE }}:sha-${{ steps.version.outputs.short_sha }}" \
            "ghcr.io/${{ env.CLIENT_IMAGE }}@${{ steps.candidate.outputs.client_digest }}"

          docker logout ghcr.io

  # =============================================================================
  # Deploy Dry Run - Manual trigger only (workflow_dispatch from any branch).
  # Validates the DO auth chain (token, cluster name, RBAC, label selector)
  # WITHOUT touching any deployment. Used once before merging this PR to
  # confirm the deploy job will succeed when it fires for real.
  # =============================================================================
  deploy-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Deploy Dry Run
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ secrets.DO_CLUSTER_NAME }}"

      - name: Probe cluster reach + RBAC + label selector
        run: |
          set -e
          echo "::group::cluster info"
          kubectl cluster-info
          echo "::endgroup::"

          echo "::group::RBAC — can I patch deployments in the bifrost namespace?"
          kubectl auth can-i patch deployment -n bifrost
          echo "::endgroup::"

          echo "::group::Deployments the real job would monitor"
          kubectl -n bifrost get deployment \
            -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker \
            -o wide
          echo "::endgroup::"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bifrost deploy dry run"
            echo ""
            echo "If the step above passed, the real \`deploy-dev\` job will work when this PR merges."
            echo ""
            echo "### Deployments that would be monitored"
            echo ""
            echo '```'
            kubectl -n bifrost get deployment \
              -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker \
              -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas \
              || echo "kubectl unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Deploy Dev - Push-to-main only. Waits for Keel to move the DigitalOcean
  # deployments to the immutable version tags published alongside :dev.
  # Targets anything labeled
  # `app.kubernetes.io/part-of=bifrost` in the `bifrost` namespace so new
  # services are picked up automatically. Failures page the maintainer via
  # GitHub's built-in workflow-failure email (no extra wiring).
  # =============================================================================
  deploy-dev:
    # Fires only after build-dev lands a new image on push: main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-dev]
    runs-on: ubuntu-latest
    name: Deploy Dev to DigitalOcean
    # Allow only one deploy at a time; if a newer commit lands mid-rollout we
    # cancel the older deploy so the cluster always converges on HEAD of main.
    concurrency:
      group: deploy-dev
      cancel-in-progress: true

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ secrets.DO_CLUSTER_NAME }}"

      - name: Wait for image automation
        env:
          EXPECTED_VERSION: ${{ needs.build-dev.outputs.version }}
        run: |
          set -euo pipefail
          expected_api="ghcr.io/${{ env.API_IMAGE }}:${EXPECTED_VERSION}"
          expected_client="ghcr.io/${{ env.CLIENT_IMAGE }}:${EXPECTED_VERSION}"
          deadline=$((SECONDS + 600))

          while true; do
            pending=0
            DEPLOYMENTS=$(kubectl -n bifrost get deployment \
              -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
            for d in $DEPLOYMENTS; do
              component=$(kubectl -n bifrost get "deployment/$d" \
                -o jsonpath='{.metadata.labels.app\.kubernetes\.io/component}')
              case "$component" in
                client) expected="$expected_client" ;;
                api|scheduler|worker) expected="$expected_api" ;;
                *) echo "Unsupported Bifrost deployment component: $d ($component)" >&2; exit 1 ;;
              esac
              images=$(kubectl -n bifrost get "deployment/$d" \
                -o jsonpath='{range .spec.template.spec.initContainers[*]}{.image}{"\n"}{end}{range .spec.template.spec.containers[*]}{.image}{"\n"}{end}')
              if [ -z "$images" ] || [ "$(printf '%s\n' "$images" | sort -u)" != "$expected" ]; then
                echo "Waiting for $d to use $expected (currently: $(printf '%s' "$images" | tr '\n' ' '))"
                pending=1
              fi
            done
            if [ "$pending" -eq 0 ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for image automation to deploy ${EXPECTED_VERSION}" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Wait for rollouts
        run: |
          set -e
          # Query the same label selector watched above, so new services are
          # picked up without editing this workflow.
          DEPLOYMENTS=$(kubectl -n bifrost get deployment \
            -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
          for d in $DEPLOYMENTS; do
            echo "::group::rollout status $d"
            kubectl -n bifrost rollout status "deployment/$d" --timeout=5m
            echo "::endgroup::"
          done

      - name: Smoke deployed API and client services
        run: |
          set -euo pipefail
          kubectl -n bifrost port-forward service/api 18000:8000 > /tmp/bifrost-api-port-forward.log 2>&1 &
          API_FORWARD_PID=$!
          kubectl -n bifrost port-forward service/client 18080:80 > /tmp/bifrost-client-port-forward.log 2>&1 &
          CLIENT_FORWARD_PID=$!
          cleanup() {
            kill "$API_FORWARD_PID" "$CLIENT_FORWARD_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for log in /tmp/bifrost-api-port-forward.log /tmp/bifrost-client-port-forward.log; do
            ready=0
            for _ in {1..40}; do
              if grep -q "Forwarding from" "$log"; then
                ready=1
                break
              fi
              sleep 0.25
            done
            if [ "$ready" -ne 1 ]; then
              cat "$log"
              exit 1
            fi
          done
          curl --fail --silent --show-error http://127.0.0.1:18000/health/ready > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -q '<div id="root">'

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bifrost deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Cluster: \`${{ secrets.DO_CLUSTER_NAME }}\`"
            echo "- Namespace: \`bifrost\`"
            echo ""
            echo "### Deployment status"
            echo ""
            kubectl -n bifrost get deployment \
              -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker \
              -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas,UPDATED:.status.updatedReplicas \
              || echo "kubectl unavailable"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Build API Image - Only on version tags, after tests pass
  # =============================================================================
  build-api:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-unit, test-e2e-gate, lint]
    runs-on: ubuntu-latest
    name: Build API Image
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC for keyless cosign signing
      attestations: write # for actions/attest-build-provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # Hard guard: plugin manifest versions must match the tag, otherwise
      # Claude Code and Codex plugin marketplaces can keep serving stale skill
      # content to users who installed via this repo. The bifrost-release skill
      # runs `scripts/update-plugin-version.sh <version>` locally before
      # tagging, so when this fails the maintainer either forgot the skill step
      # or the bump commit didn't make it onto the tagged ref.
      - name: Verify plugin manifest matches tag
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          failed=0
          for manifest in \
            .claude-plugin/plugin.json \
            .codex-plugin/plugin.json \
            plugins/bifrost/.codex-plugin/plugin.json; do
            manifest_version=$(jq -r '.version' "$manifest")
            if [[ "$manifest_version" != "$TAG_VERSION" ]]; then
              echo "::error::${manifest} version (${manifest_version}) does not match tag (${TAG_VERSION})."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Run 'scripts/update-plugin-version.sh $TAG_VERSION' on main, commit, then re-tag."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            # Semantic version tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # SHA for traceability
            type=sha
            # Latest tag only on stable releases (not pre-releases like v1.0.0-beta)
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign API image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.API_IMAGE }}@${{ steps.build-api.outputs.digest }}

      - name: Attest API image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------------------------
      # Transitional dual-publish to legacy ghcr.io/jackmusick/* namespace.
      # Sunset: remove after 2 stable releases or 60 days post-transfer.
      # ---------------------------------------------------------------------------
      - name: Dual-publish API release image to legacy jackmusick namespace
        env:
          GHCR_LEGACY_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
        if: ${{ env.GHCR_LEGACY_TOKEN != '' }}
        run: |
          echo "$GHCR_LEGACY_TOKEN" | docker login ghcr.io -u jackmusick --password-stdin
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            legacy_tag=$(echo "$tag" | sed "s|ghcr.io/${{ env.API_IMAGE }}|ghcr.io/${{ env.LEGACY_API_IMAGE }}|")
            docker pull "$tag"
            docker tag  "$tag" "$legacy_tag"
            docker push "$legacy_tag"
          done
          docker logout ghcr.io

  # =============================================================================
  # Build Client Image - Only on version tags, after tests pass
  # =============================================================================
  build-client:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-unit, test-e2e-gate, lint]
    runs-on: ubuntu-latest
    name: Build Client Image
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC for keyless cosign signing
      attestations: write # for actions/attest-build-provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}
          tags: |
            # Semantic version tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # SHA for traceability
            type=sha
            # Latest tag only on stable releases (not pre-releases like v1.0.0-beta)
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push client image
        id: build-client
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign client image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.CLIENT_IMAGE }}@${{ steps.build-client.outputs.digest }}

      - name: Attest client image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.CLIENT_IMAGE }}
          subject-digest: ${{ steps.build-client.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------------------------
      # Transitional dual-publish to legacy ghcr.io/jackmusick/* namespace.
      # Sunset: remove after 2 stable releases or 60 days post-transfer.
      # ---------------------------------------------------------------------------
      - name: Dual-publish client release image to legacy jackmusick namespace
        env:
          GHCR_LEGACY_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
        if: ${{ env.GHCR_LEGACY_TOKEN != '' }}
        run: |
          echo "$GHCR_LEGACY_TOKEN" | docker login ghcr.io -u jackmusick --password-stdin
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            legacy_tag=$(echo "$tag" | sed "s|ghcr.io/${{ env.CLIENT_IMAGE }}|ghcr.io/${{ env.LEGACY_CLIENT_IMAGE }}|")
            docker pull "$tag"
            docker tag  "$tag" "$legacy_tag"
            docker push "$legacy_tag"
          done
          docker logout ghcr.io

  # =============================================================================
  # Create GitHub Release - Only on version tags, after images are built.
  # Release assets are signed with Sigstore/cosign (keyless OIDC) and a SLSA
  # build provenance attestation is generated via GitHub's native attestation
  # action. Both feed Scorecard's Signed-Releases check.
  # =============================================================================
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-api, build-client]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write       # upload assets to the GitHub Release
      id-token: write       # OIDC token for keyless cosign signing
      attestations: write   # actions/attest-build-provenance writes attestations

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Check if this is a pre-release (contains hyphen like v1.0.0-beta)
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Copy type stubs
        run: |
          if [ -f "stubs/bifrost.pyi" ]; then
            cp stubs/bifrost.pyi bifrost.pyi
          else
            echo "Warning: bifrost.pyi not found in stubs/, skipping"
          fi

      # Produce a reproducible source tarball as a primary release artifact so
      # Scorecard's Signed-Releases check has something concrete to verify
      # against (it ignores tag-only releases).
      - name: Build source tarball
        id: source_tarball
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TARBALL="bifrost-${VERSION}-source.tar.gz"
          git archive --format=tar.gz --prefix="bifrost-${VERSION}/" -o "${TARBALL}" HEAD
          sha256sum "${TARBALL}" | tee "${TARBALL}.sha256"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      # Keyless OIDC signing: cosign exchanges the GitHub Actions OIDC token
      # for a short-lived Fulcio cert, signs, and records the signature in
      # Rekor. The .sigstore bundle is the format Scorecard's Signed-Releases
      # check recognizes (alongside .sig, .asc, .minisig, .sign).
      - name: Sign release artifacts with cosign
        run: |
          set -euo pipefail
          ARTIFACTS=("${{ steps.source_tarball.outputs.tarball }}")
          if [ -f "bifrost.pyi" ]; then
            ARTIFACTS+=("bifrost.pyi")
          fi
          for f in "${ARTIFACTS[@]}"; do
            cosign sign-blob --yes \
              --bundle "${f}.sigstore" \
              "${f}"
          done

      # SLSA build provenance — stored in GitHub's transparency log and
      # discoverable via `gh attestation verify`. Independent signal from the
      # cosign blob signatures above.
      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.source_tarball.outputs.tarball }}

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          files: |
            ${{ steps.source_tarball.outputs.tarball }}
            ${{ steps.source_tarball.outputs.tarball }}.sha256
            ${{ steps.source_tarball.outputs.tarball }}.sigstore
            bifrost.pyi
            bifrost.pyi.sigstore
            stubs/DISTRIBUTION.md
          fail_on_unmatched_files: false
          body: |
            ## Bifrost ${{ steps.get_version.outputs.version }}

            ### Docker Images

            **API:**
            ```bash
            docker pull ghcr.io/gobifrost/bifrost-api:${{ steps.get_version.outputs.version }}
            ```

            **Client:**
            ```bash
            docker pull ghcr.io/gobifrost/bifrost-client:${{ steps.get_version.outputs.version }}
            ```

            ### Type Stubs for IDEs
            Download `bifrost.pyi` from the assets below and place it in your workspace directory for IDE autocomplete and type checking support.

            See `DISTRIBUTION.md` for instructions.

            ### Signed artifacts (Sigstore / cosign — keyless)

            Each release asset has a matching `.sigstore` bundle (Sigstore's
            self-contained signature + certificate + Rekor inclusion proof,
            produced via keyless OIDC — no maintainer-held keys involved).

            Verify with cosign (>= v2.4):

            ```bash
            cosign verify-blob \
              --bundle bifrost-${{ steps.get_version.outputs.version }}-source.tar.gz.sigstore \
              --certificate-identity-regexp 'https://github\.com/gobifrost/bifrost/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              bifrost-${{ steps.get_version.outputs.version }}-source.tar.gz
            ```

