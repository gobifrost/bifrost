# Dependabot auto-merge policy enforcement
#
# Policy (also documented in SECURITY.md):
#   - Security advisory bumps  → auto-merge when CI green (any semver level)
#   - Patch updates            → auto-merge when CI green
#   - Minor updates            → auto-merge when CI green
#   - Major updates            → label needs-review, leave open
#   - Docker base images       → label needs-review, leave open
#
# Mechanism: enable GitHub auto-merge on the eligible PRs. Branch protection
# requires CI green before merge happens, so this never bypasses CI.
#
# `main` is protected by a merge queue (ruleset "Protect Branch",
# merge_method: SQUASH). `gh pr merge` against a merge-queue branch does not
# take a merge strategy flag: per `gh pr merge --help`, "When targeting a
# branch that requires a merge queue, no merge strategy is required. If
# required checks have not yet passed, auto-merge will be enabled. If
# required checks have passed, the pull request will be added to the merge
# queue." Passing `--squash` here defeats that and always falls back to
# enabling auto-merge, which never enters the queue on its own — a human has
# to `gh pr merge --disable-auto` then re-run `gh pr merge` by hand (this
# stranded PRs #786, #718, #828). Do not add a strategy flag back; the queue
# already enforces squash.

name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write # required to enable auto-merge on the PR
      pull-requests: write # required to label and merge the PR
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          alert-lookup: true

      - name: Auto-merge security advisory bumps (any semver level)
        if: steps.metadata.outputs.alert-state == 'OPEN'
        run: gh pr merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge non-major version updates (skip Docker)
        if: |
          steps.metadata.outputs.alert-state == '' &&
          steps.metadata.outputs.package-ecosystem != 'docker' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label majors and Docker for human review
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          steps.metadata.outputs.package-ecosystem == 'docker'
        run: gh pr edit "$PR_URL" --add-label needs-review
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
