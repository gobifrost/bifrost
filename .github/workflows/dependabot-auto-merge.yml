# Dependabot auto-merge policy enforcement
#
# Policy (also documented in SECURITY.md):
#   - Security advisory bumps  → auto-merge when CI green (any semver level)
#   - Patch updates            → auto-merge when CI green
#   - Minor updates            → auto-merge when CI green
#   - Major updates            → label needs-review, leave open
#   - Docker base images       → label needs-review, leave open
#
# Mechanism: enable GitHub auto-merge on the eligible PRs. Branch protection
# requires CI green before merge happens, so this never bypasses CI.
#
# `main` is protected by a merge queue (ruleset "Protect Branch",
# merge_method: SQUASH). `gh pr merge` against a merge-queue branch does not
# take a merge strategy flag: per `gh pr merge --help`, "When targeting a
# branch that requires a merge queue, no merge strategy is required. If
# required checks have not yet passed, auto-merge will be enabled. If
# required checks have passed, the pull request will be added to the merge
# queue." Passing `--squash` here defeats that and always falls back to
# enabling auto-merge, which never enters the queue on its own — a human has
# to `gh pr merge --disable-auto` then re-run `gh pr merge` by hand (this
# stranded PRs #786, #718, #828). Do not add a strategy flag back; the queue
# already enforces squash.
#
# Why a GitHub App token, not GITHUB_TOKEN: once `main` got a merge queue
# (ruleset change 2026-06-10), auto-merge enabled by GITHUB_TOKEN stopped ever
# entering the queue — the last automatic Dependabot merge was #365 that day.
# Queue membership is driven by a merge_group CI run, and GitHub doesn't start
# workflow runs for events caused by GITHUB_TOKEN. Enabling auto-merge as the
# `bifrost-lockfile-bot` App (Dependabot secrets DEPENDABOT_LOCKFILE_APP_ID /
# DEPENDABOT_LOCKFILE_APP_PRIVATE_KEY; App needs Contents + Pull requests:
# read & write) makes the queue entry an App action, like a human's.

name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependabot-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write # label majors/Docker; auto-merge itself uses the App token
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          alert-lookup: true

      - name: Decide whether this PR auto-merges
        id: eligible
        env:
          ALERT_STATE: ${{ steps.metadata.outputs.alert-state }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [[ "$ALERT_STATE" == "OPEN" ]]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"   # security advisory, any semver level
          elif [[ -z "$ALERT_STATE" && "$ECOSYSTEM" != "docker" && ( "$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor" ) ]]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"   # non-major, non-Docker version update
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDABOT_LOCKFILE_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_LOCKFILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Record canonical dependency disposition
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPENDABOT_ALERT_STATE: ${{ steps.metadata.outputs.alert-state }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { recordDependabotDisposition } = require(`${process.env.GITHUB_WORKSPACE}/scripts/dependabot_product_updates.cjs`);
            await recordDependabotDisposition({
              github,
              repository: context.repo,
              number: context.payload.pull_request.number,
              alertState: process.env.DEPENDABOT_ALERT_STATE,
            });

      - name: Enable auto-merge (enters the merge queue once checks pass)
        if: steps.eligible.outputs.merge == 'true'
        run: gh pr merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Label majors and Docker for human review
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          steps.metadata.outputs.package-ecosystem == 'docker'
        run: gh pr edit "$PR_URL" --add-label needs-review
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
