name: Capacity Conformance

on:
  pull_request:
    paths:
      - "deploy/capacity/**"
      - ".github/workflows/capacity-conformance.yml"
  push:
    branches: [main]
    paths:
      - "deploy/capacity/**"
      - ".github/workflows/capacity-conformance.yml"
  merge_group:

permissions:
  contents: read

jobs:
  reference-provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Core, Adapter Readback, and Negative Control
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            python:3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928 \
            sh -c 'python -m unittest discover -s deploy/capacity/conformance -p "test_*.py" -v && python deploy/capacity/conformance/selftest.py'
