name: Capacity Conformance

on:
  pull_request:
    paths:
      - "deploy/capacity/**"
      - "deploy/cloudflare/worker/**"
      - ".github/workflows/capacity-conformance.yml"
  push:
    branches: [main]
    paths:
      - "deploy/capacity/**"
      - "deploy/cloudflare/worker/**"
      - ".github/workflows/capacity-conformance.yml"
  merge_group:

permissions:
  contents: read

jobs:
  reference-provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Core, Adapter Readback, and Negative Control
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            python:3.16.0a1-slim@sha256:df293ba3b89f458e1aad6051b62ff1c4fad7b3b52b8147ae9cc4b667f9cf2741 \
            sh -c 'python -m unittest discover -s deploy/capacity/conformance -p "test_*.py" -v && python deploy/capacity/conformance/selftest.py'
      - name: Check Native Cloudflare Provider
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            node:26.13.0-bookworm-slim@sha256:add5c17c14752c54d2f3d519ec46a3815684d41c33f198bcb09fb998f7dcbf68 \
            node --test deploy/cloudflare/worker/capacity.test.mjs
