name: Usage Reporting

on:
  pull_request:
    branches: [main]
    paths:
      - deploy/usage-reporting/**
      - scripts/test-usage-reporting.sh
      - test.sh
      - .github/workflows/usage-reporting.yml
  push:
    branches: [main]
    paths:
      - deploy/usage-reporting/**
      - scripts/test-usage-reporting.sh
      - test.sh
      - .github/workflows/usage-reporting.yml
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-reporting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Usage Receiver Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Type check and test in the Workers runtime
        run: ./test.sh reporting
